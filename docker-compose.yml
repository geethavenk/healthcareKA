version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: healthcare_postgres 
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data  
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - healthcare_net

  neo4j:
      image: neo4j:5
      container_name: healthcare_neo4j
      restart: unless-stopped
      env_file:
        - .env
      environment:
        NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      ports:
        - "7474:7474"
        - "7687:7687"  
      volumes:
        - neo4j_data:/data
      healthcheck:
        test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
        interval: 5s
        timeout: 5s
        retries: 10
      networks:
        - healthcare_net

  backend:
    build: 
      context: ./app
      dockerfile: Dockerfile 
    container_name: healthcare_backend
    restart: unless-stopped
    env_file:
      - .env 
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - healthcare_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healthcare_frontend
    restart: unless-stopped
    env_file:
      - .env 
    ports:
      - "8501:8501"   
    depends_on:
      - backend
    networks:
      - healthcare_net

volumes:
  postgres_data:
  neo4j_data:

networks:
  healthcare_net:
    driver: bridge       


